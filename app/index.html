<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数学口算乐园</title>
<style>
:root{
  --bg:#FFF6E8; --ink:#3B2F2F; --card:#FFFFFF;
  --green:#4CAF50; --green-d:#2E7D32;
  --orange:#FF9800; --red:#E53935; --blue:#42A5F5; --purple:#AB47BC;
  --yellow:#FFD54F;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  background:var(--bg); color:var(--ink); overflow:hidden;
  -webkit-user-select:none;user-select:none; touch-action:manipulation;
}
#app{height:100%;max-width:560px;margin:0 auto;position:relative;background:
  radial-gradient(circle at 15% 10%, #FFE9C7 0, transparent 40%),
  radial-gradient(circle at 85% 90%, #D8F3DC 0, transparent 45%), var(--bg);}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column;padding:14px;}
.screen.active{display:flex;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
button{font-family:inherit;border:none;cursor:pointer;}

/* ---------- 通用顶栏 ---------- */
.topbar{display:flex;align-items:center;margin-bottom:10px;}
.topbar>*+*{margin-left:10px;}
.btn-home{width:44px;height:44px;border-radius:14px;background:#fff;font-size:20px;
  box-shadow:0 3px 0 #e0d5c5;display:flex;align-items:center;justify-content:center;flex:none;}
.btn-home:active{transform:translateY(2px);box-shadow:0 1px 0 #e0d5c5;}
.hud{flex:1;display:flex;justify-content:flex-end;flex-wrap:wrap;}
.hud>*+*{margin-left:8px;}
.hud-pill{background:#fff;border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;
  box-shadow:0 2px 0 #e8ddcb;white-space:nowrap;}
.hud-pill.small{font-size:13px;color:#8a7a6a;font-weight:600;}

/* ---------- 主页 ---------- */
#home{align-items:center;justify-content:flex-start;padding-top:26px;overflow-y:auto;}
.logo{font-size:40px;letter-spacing:2px;font-weight:900;color:#3B2F2F;text-align:center;line-height:1.25;}
.logo span{color:var(--green-d);}
.logo-sub{font-size:14px;color:#9c8a76;margin:6px 0 18px;}
.diff-row{display:flex;margin-bottom:20px;background:#fff;padding:6px;border-radius:999px;box-shadow:0 3px 0 #e8ddcb;}
.diff-row>*+*{margin-left:8px;}
.diff-btn{padding:9px 16px;border-radius:999px;background:transparent;font-size:15px;font-weight:700;color:#8a7a6a;}
.diff-btn.on{background:var(--green);color:#fff;box-shadow:0 2px 0 var(--green-d);}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;padding-bottom:20px;}
.menu-card{background:var(--card);border-radius:22px;padding:18px 12px 14px;text-align:center;
  box-shadow:0 5px 0 #e8ddcb;transition:transform .1s;}
.menu-card:active{transform:translateY(3px) scale(.98);box-shadow:0 2px 0 #e8ddcb;}
.menu-emoji{font-size:44px;line-height:1;display:block;margin-bottom:8px;}
.menu-name{font-size:18px;font-weight:900;}
.menu-desc{font-size:12px;color:#9c8a76;margin-top:4px;line-height:1.4;}

/* ---------- 出题条 ---------- */
.qbar{background:#fff;border-radius:18px;padding:10px 16px;text-align:center;margin-bottom:10px;
  box-shadow:0 3px 0 #e8ddcb;}
.qbar .q-text{font-size:30px;font-weight:900;letter-spacing:2px;}
.qbar .q-label{font-size:13px;color:#9c8a76;font-weight:600;}

/* ---------- 九宫格键盘 ---------- */
.answer-display{background:#fff;border-radius:16px;min-height:56px;display:flex;align-items:center;
  justify-content:center;font-size:32px;font-weight:900;letter-spacing:4px;margin-bottom:8px;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.08);color:var(--green-d);}
.answer-display .placeholder{color:#c9bba8;font-size:20px;letter-spacing:2px;font-weight:600;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.key{height:54px;border-radius:16px;background:#fff;font-size:24px;font-weight:900;color:var(--ink);
  box-shadow:0 4px 0 #e0d5c5;}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #e0d5c5;}
.key.ok{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);font-size:22px;}
.key.del{background:#FFE0D6;color:#c0392b;box-shadow:0 4px 0 #f0c0b0;font-size:22px;}
.key.wide{grid-column:span 1;}

/* ---------- 通用弹层（成绩单） ---------- */
.overlay{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(59,47,47,.45);display:none;
  align-items:center;justify-content:center;z-index:50;padding:20px;}
.overlay.show{display:flex;}
.result-card{background:#FFFDF8;border-radius:26px;padding:26px 22px;width:100%;max-width:340px;
  text-align:center;animation:pop .3s cubic-bezier(.2,1.6,.4,1);}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.result-title{font-size:26px;font-weight:900;margin-bottom:6px;}
.result-stars{font-size:34px;letter-spacing:6px;margin:8px 0;}
.result-lines{font-size:16px;line-height:2;color:#6b5d4f;font-weight:600;}
.result-lines b{color:var(--green-d);font-size:20px;}
.result-btns{display:flex;margin-top:18px;}
.result-btns>*+*{margin-left:10px;}
.btn-big{flex:1;padding:13px;border-radius:16px;font-size:17px;font-weight:900;color:#fff;
  background:var(--green);box-shadow:0 4px 0 var(--green-d);}
.btn-big.gray{background:#B0A696;box-shadow:0 4px 0 #8a7a6a;}
.btn-big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d);}
</style>
<style>
/* ================= 打地鼠 ================= */
#game-mole .qbar .q-text{color:var(--green-d);}
.mole-field{flex:1;background:linear-gradient(#8FD14F 0%, #7CB342 60%, #689F38 100%);
  border-radius:22px;position:relative;overflow:hidden;display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:6px;padding:14px 10px 8px;box-shadow:inset 0 4px 12px rgba(0,0,0,.15);}
.hole{position:relative;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
.hole::after{content:"";position:absolute;bottom:2px;left:12%;right:12%;height:22px;
  background:radial-gradient(ellipse at center,#5a4028 30%,#3e2b1a 70%,transparent 75%);
  border-radius:50%;}
.mole{position:absolute;bottom:-140px;width:76%;max-width:92px;transition:bottom .18s ease-out;
  display:flex;flex-direction:column;align-items:center;z-index:2;}
.hole.up .mole{bottom:6px;}
.mole-body{width:100%;height:0;padding-bottom:105%;background:#A9825A;border-radius:46% 46% 40% 40%;
  position:relative;box-shadow:inset -6px -8px 0 rgba(0,0,0,.12);}
.mole-body::before,.mole-body::after{content:"";position:absolute;top:26%;width:9px;height:9px;
  background:#2b1d10;border-radius:50%;}
.mole-body::before{left:24%}.mole-body::after{right:24%}
.mole-nose{position:absolute;top:44%;left:50%;transform:translateX(-50%);width:12px;height:9px;
  background:#5a4028;border-radius:50%;}
.mole-ear-l,.mole-ear-r{position:absolute;top:-8px;width:20px;height:20px;background:#A9825A;
  border-radius:50%;box-shadow:inset 0 0 0 5px #8a6a48;}
.mole-ear-l{left:8px}.mole-ear-r{right:8px}
.mole-board{position:absolute;top:-20px;left:50%;transform:translateX(-50%);z-index:6;
  background:#FFFDF8;border:3px solid #D9A05B;border-radius:12px;padding:4px 10px;
  font-size:19px;font-weight:900;white-space:nowrap;box-shadow:0 3px 5px rgba(0,0,0,.25);
  color:#3B2F2F;pointer-events:none;}
.mole-board.long{font-size:15px;padding:3px 6px;letter-spacing:0;}
.mole-body{z-index:1;}
.hole.bonked .mole{transition:bottom .1s;bottom:-140px;}
.bonk-fx{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:30px;
  z-index:5;pointer-events:none;animation:bonk .45s ease forwards;}
@keyframes bonk{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-46px) scale(1.6)}}
.mole-timer{height:10px;background:#fff;border-radius:99px;overflow:hidden;margin-bottom:10px;box-shadow:inset 0 2px 4px rgba(0,0,0,.12);}
.mole-timer i{display:block;height:100%;background:var(--orange);border-radius:99px;width:100%;}
.speed-row{display:flex;background:#fff;padding:4px;border-radius:999px;box-shadow:0 2px 0 #e8ddcb;}
.speed-row>*+*{margin-left:4px;}
.speed-btn{padding:5px 11px;border-radius:999px;background:transparent;font-size:13px;font-weight:700;color:#8a7a6a;}
.speed-btn.on{background:var(--orange);color:#fff;}

/* ================= 搭桥救动物 ================= */
.bridge-scene{background:linear-gradient(#B3E5FC 0 55%, #90CAF9 55% 100%);
  border-radius:22px;height:150px;position:relative;margin-bottom:12px;overflow:hidden;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.1);}
.bridge-boy{position:absolute;left:8px;bottom:38px;font-size:38px;z-index:3;
  transition:transform .3s;}
.bridge-animal{position:absolute;right:8px;bottom:38px;font-size:38px;z-index:3;
  animation:bob 1.2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bridge-track{position:absolute;left:56px;right:56px;bottom:14px;height:34px;display:flex;
  align-items:flex-end;z-index:2;}
.plank+.plank{margin-left:3px;}
.plank{flex:1;height:16px;background:#D9A05B;border-radius:4px;box-shadow:inset 0 -4px 0 #b57e3e;
  transform:scaleY(0);transform-origin:bottom;transition:transform .3s cubic-bezier(.2,1.6,.4,1);}
.plank.on{transform:scaleY(1);}
.bridge-scene.saved .bridge-animal{animation:rescue .8s ease forwards;}
@keyframes rescue{40%{transform:translateY(-30px) scale(1.2)}100%{transform:translate(-20px,-6px)}}
#game-bridge .keypad{flex:1;align-content:start;}
#game-bridge .key{height:auto;min-height:50px;}

/* ================= 口算赛车 ================= */
.race-track{background:repeating-linear-gradient(90deg,#78909C 0 40px,#607D8B 40px 80px);
  border-radius:22px;height:150px;position:relative;margin-bottom:12px;padding:18px 46px 18px 14px;
  overflow:hidden;box-shadow:inset 0 3px 8px rgba(0,0,0,.2);}
.race-finish{position:absolute;top:0;bottom:0;right:22px;width:12px;
  background:repeating-conic-gradient(#fff 0 25%, #222 0 50%) 0 0/12px 12px;}
.race-lane{height:56px;position:relative;display:flex;align-items:center;}
.race-lane::after{content:"";position:absolute;left:0;right:0;bottom:2px;
  border-bottom:3px dashed rgba(255,255,255,.55);}
.race-lane:last-of-type::after{display:none;}
.race-car{position:absolute;left:0;font-size:34px;transition:left .35s ease;z-index:2;
  transform:scaleX(-1);filter:drop-shadow(0 3px 2px rgba(0,0,0,.3));}
.race-car.boost{animation:boost .35s ease;}
@keyframes boost{30%{transform:scaleX(-1) translateX(10px) rotate(-4deg)}}
.race-tag{position:absolute;right:6px;font-size:11px;color:#fff;font-weight:700;opacity:.8;}
#game-race .keypad{flex:1;align-content:start;}
#game-race .key{height:auto;min-height:50px;}
.race-flash{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;border-radius:22px;}

/* ================= 贪吃蛇（输入答案版） ================= */
.snake-scene{background:linear-gradient(#A5D6A7, #7CB342);border-radius:22px;height:190px;
  position:relative;margin-bottom:12px;overflow:hidden;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.12);}
.fruit-row{position:absolute;top:26px;left:0;right:0;display:flex;justify-content:center;}
.fruit-row>*+*{margin-left:26px;}
.fruit{font-size:56px;line-height:1;filter:drop-shadow(0 5px 4px rgba(0,0,0,.25));
  transition:transform .35s ease, opacity .35s ease;}
.fruit.eaten{transform:translateY(70px) scale(.2);opacity:0;}
.fruit.shake{animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.snake-body-wrap{position:absolute;bottom:26px;left:18px;right:18px;display:flex;
  align-items:center;min-height:44px;}
.seg{width:34px;height:34px;background:#7CB342;border-radius:10px;flex:none;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.12);margin-right:-4px;}
.seg.head{background:#8BC34A;width:42px;height:42px;border-radius:14px;position:relative;
  margin-right:0;animation:bob 1.4s ease-in-out infinite;}
.seg.head::before,.seg.head::after{content:"";position:absolute;top:10px;width:7px;height:7px;
  background:#234021;border-radius:50%;}
.seg.head::before{left:9px}.seg.head::after{right:9px}
.snake-tongue{position:absolute;right:-9px;top:50%;width:12px;height:3px;background:#E53935;
  transform:translateY(-50%);border-radius:2px;}
.snake-body-wrap.eat .seg.head{animation:chomp .5s ease;}
@keyframes chomp{40%{transform:scale(1.25)}}
#game-snake .keypad{flex:1;align-content:start;}
#game-snake .key{height:auto;min-height:50px;}

/* ================= 家长报告 ================= */
.report-card{grid-column:span 2;}
.report-body{flex:1;overflow-y:auto;padding-bottom:24px;}
.r-sec{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;
  box-shadow:0 3px 0 #e8ddcb;}
.r-sec h3{font-size:16px;font-weight:900;margin-bottom:10px;color:#3B2F2F;}
.r-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;}
.r-num{font-size:22px;font-weight:900;color:var(--green-d);}
.r-lbl{font-size:12px;color:#9c8a76;margin-top:2px;}
.r-bars{display:flex;align-items:flex-end;height:110px;padding-top:6px;}
.r-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;
  justify-content:flex-end;margin:0 4px;}
.r-bar-col>*+*{margin-top:4px;}
.r-bars>*+*{margin-left:8px;}
.r-bar{width:70%;max-width:34px;background:linear-gradient(#81C784,#4CAF50);border-radius:6px 6px 0 0;
  min-height:4px;}
.r-bar-d{font-size:10px;color:#9c8a76;}
.r-bar-a{font-size:10px;font-weight:700;color:var(--green-d);}
.r-table{width:100%;border-collapse:collapse;font-size:13px;}
.r-table th{text-align:left;color:#9c8a76;font-weight:600;padding:4px 2px;font-size:12px;}
.r-table td{padding:6px 2px;border-top:1px solid #f0e8dc;font-weight:600;}
.r-insight{font-size:14px;line-height:1.9;color:#5b4f43;}
.r-insight li{margin-left:18px;}
.r-wrong-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;
  border-top:1px solid #f0e8dc;font-size:14px;font-weight:700;}
.r-wrong-item small{color:#9c8a76;font-weight:600;}
.r-badge{background:#FFE0D6;color:#c0392b;border-radius:99px;padding:2px 10px;font-size:12px;
  font-weight:900;flex:none;}
.r-empty{text-align:center;color:#9c8a76;padding:40px 0;font-size:15px;line-height:2;}
.r-clear{width:100%;padding:11px;border-radius:14px;background:#f5f0e8;color:#8a7a6a;
  font-size:14px;font-weight:700;margin-top:4px;}
.r-summary{font-size:14px;line-height:1.9;color:#5b4f43;}
.r-summary b{color:var(--green-d);}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 主页 ============ -->
  <div class="screen active" id="home">
    <div class="logo">数学口算<span>乐园</span></div>
    <div class="logo-sub">二年级 · 加减 × 乘法 × 混合运算</div>
    <div class="logo-sub" id="jsCheck" style="color:#c0392b;">⚠️ 脚本未运行：请换浏览器打开（推荐 Edge）</div>
    <div class="diff-row" id="diffRow">
      <button class="diff-btn" data-diff="addsub">加减法</button>
      <button class="diff-btn" data-diff="mul">乘法</button>
      <button class="diff-btn on" data-diff="mix">混合运算</button>
    </div>
    <div class="menu-grid">
      <button class="menu-card" data-game="mole">
        <span class="menu-emoji">🔨</span>
        <div class="menu-name">口算打地鼠</div>
        <div class="menu-desc">算出目标数<br>打对地鼠</div>
      </button>
      <button class="menu-card" data-game="bridge">
        <span class="menu-emoji">🌉</span>
        <div class="menu-name">搭桥救动物</div>
        <div class="menu-desc">答一题铺一板<br>救回小动物</div>
      </button>
      <button class="menu-card" data-game="race">
        <span class="menu-emoji">🏎️</span>
        <div class="menu-name">口算赛车</div>
        <div class="menu-desc">答对加速<br>抢先冲线</div>
      </button>
      <button class="menu-card" data-game="snake">
        <span class="menu-emoji">🐍</span>
        <div class="menu-name">贪吃蛇吃答案</div>
        <div class="menu-desc">算出答案输进去<br>蛇蛇吃果长一节</div>
      </button>
      <button class="menu-card report-card" data-game="report">
        <span class="menu-emoji">📊</span>
        <div class="menu-name">家长报告</div>
        <div class="menu-desc">练习记录 · 薄弱分析 · 错题榜</div>
      </button>
    </div>
  </div>
  <div class="screen" id="game-mole">
    <div class="topbar">
      <button class="btn-home" data-home>🏠</button>
      <div class="speed-row" id="moleSpeedRow">
        <button class="speed-btn" data-speed="slow">慢</button>
        <button class="speed-btn on" data-speed="normal">正常</button>
        <button class="speed-btn" data-speed="fast">快</button>
      </div>
      <div class="hud">
        <div class="hud-pill" id="mole-score">⭐ 0</div>
        <div class="hud-pill" id="mole-hits">🔨 0</div>
      </div>
    </div>
    <div class="mole-timer"><i id="mole-timerbar"></i></div>
    <div class="qbar">
      <div class="q-label">等于几？敲打答案是它的地鼠！</div>
      <div class="q-text" id="mole-target">= 42</div>
    </div>
    <div class="mole-field" id="moleField"></div>
  </div>

  <!-- ============ 搭桥救动物 ============ -->
  <div class="screen" id="game-bridge">
    <div class="topbar">
      <button class="btn-home" data-home>🏠</button>
      <div class="hud">
        <div class="hud-pill" id="bridge-progress">第 1 / 10 题</div>
      </div>
    </div>
    <div class="bridge-scene" id="bridgeScene">
      <div class="bridge-boy">🧒</div>
      <div class="bridge-track" id="bridgeTrack"></div>
      <div class="bridge-animal" id="bridgeAnimal">🐰</div>
    </div>
    <div class="qbar">
      <div class="q-label">答对一题，铺一块桥板！</div>
      <div class="q-text" id="bridge-q">3 × 5 + 8 = ?</div>
    </div>
    <div class="answer-display" id="bridge-display"><span class="placeholder">点下面的数字</span></div>
    <div class="keypad" id="bridge-keypad"></div>
  </div>

  <!-- ============ 口算赛车 ============ -->
  <div class="screen" id="game-race">
    <div class="topbar">
      <button class="btn-home" data-home>🏠</button>
      <div class="hud">
        <div class="hud-pill" id="race-count">🏁 0 题</div>
      </div>
    </div>
    <div class="race-track" id="raceTrack">
      <div class="race-lane">
        <div class="race-car player" id="racePlayer">🏎️</div>
        <div class="race-tag">你</div>
      </div>
      <div class="race-lane">
        <div class="race-car rival" id="raceRival">🚙</div>
        <div class="race-tag">对手</div>
      </div>
      <div class="race-finish"></div>
    </div>
    <div class="qbar">
      <div class="q-label">答对加速，答错减速，看谁先冲线！</div>
      <div class="q-text" id="race-q">7 × 8 = ?</div>
    </div>
    <div class="answer-display" id="race-display"><span class="placeholder">点下面的数字</span></div>
    <div class="keypad" id="race-keypad"></div>
  </div>

  <!-- ============ 贪吃蛇 ============ -->
  <div class="screen" id="game-snake">
    <div class="topbar">
      <button class="btn-home" data-home>🏠</button>
      <div class="hud">
        <div class="hud-pill" id="snake-score">⭐ 0</div>
        <div class="hud-pill" id="snake-progress">🍎 0 / 10</div>
      </div>
    </div>
    <div class="snake-scene" id="snakeScene">
      <div class="fruit-row" id="fruitRow"></div>
      <div class="snake-body-wrap" id="snakeBodyWrap"></div>
    </div>
    <div class="qbar">
      <div class="q-label">算出答案输进去，蛇蛇就去吃对的果子！</div>
      <div class="q-text" id="snake-q">6 × 7 = ?</div>
    </div>
    <div class="answer-display" id="snake-display"><span class="placeholder">点下面的数字</span></div>
    <div class="keypad" id="snake-keypad"></div>
  </div>

  <!-- ============ 家长报告 ============ -->
  <div class="screen" id="game-report">
    <div class="topbar">
      <button class="btn-home" data-home>🏠</button>
      <div class="hud"><div class="hud-pill">📊 家长报告</div></div>
    </div>
    <div class="report-body" id="reportBody"></div>
  </div>

  <!-- 通用结算弹层 -->
  <div class="overlay" id="overlay">
    <div class="result-card">
      <div class="result-title" id="rTitle">太棒了！</div>
      <div class="result-stars" id="rStars">⭐⭐⭐</div>
      <div class="result-lines" id="rLines"></div>
      <div class="result-btns">
        <button class="btn-big gray" id="rHome">回主页</button>
        <button class="btn-big" id="rAgain">再玩一次</button>
      </div>
    </div>
  </div>

</div>
